version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: mysql8-day4
    restart: always
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: namtran138
      MYSQL_DATABASE: day4
      MYSQL_USER: user4
      MYSQL_PASSWORD: user4
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
